# ExpectStableThroughput with tag quotas enforced by clients, and one-page transactions that start in batches of 1, 2,
# 4 and 8, each batch sharing one read version request. Transactions the client throttles are not retried, so the
# batches stay whole.
[configuration]
buggify = false
tenantModes = ['disabled']

[[knobs]]
global_tag_throttling = true
enforce_tag_throttling_on_proxies = false

[[test]]
testTitle='ExpectStableThroughputClientModeBatchesOf1'

  [[test.workload]]
  testName='ThroughputQuota'
  transactionTag='batchesOf1'
  totalQuotaInPages=50

  [[test.workload]]
  testName='ExpectStableThroughput'
  throttlingTag='batchesOf1'
  expectedThroughputPagesRate=50
  errorTolerance=0.2
  testDuration=600.0
  numActors=1
  attemptedTransactionRatePerActor=200
  opsPerTransaction=1
  transactionsPerBatch=1

